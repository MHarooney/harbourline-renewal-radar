<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="646" viewBox="0 0 1080 646" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="ttl desc">
<title id="ttl">Relay client onboarding: proposed flow</title>
<desc id="desc">A new brand creates an onboarding run. Nine steps run in three parallel lanes: access granted by a person, workspace created by Relay, and commercial decisions made by a person. Relay records status, owner, due date, attempts and evidence for every step. The kickoff call and welcome email wait until access, contract and billing are done. If a step fails, Relay retries what is safely retryable, assigns an owner with an SLA clock for anything else, escalates on breach, and resumes from the blocked step without discarding completed work. The run completes when every required step is done or explicitly waived with a written reason.</desc>
<rect width="1080" height="646" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c6cedb"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e8cf9e"/></marker></defs>
<text x="40" y="40" font-size="21" fill="#16202b" font-weight="700" text-anchor="start" letter-spacing="-0.3">Relay — client onboarding</text>
<text x="40" y="63" font-size="13" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">Relay owns sequence, state, reminders and the audit trail. People keep credentials, legal and money decisions.</text>
<rect x="40" y="92" width="190" height="48" rx="8" fill="#14344f" stroke="#14344f"/>
<text x="135" y="121" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle" letter-spacing="0">New brand signed</text>
<polyline points="232 116 254 116" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="258" y="92" width="270" height="48" rx="8" fill="#ffffff" stroke="#c6cedb"/>
<text x="393" y="113" font-size="14" fill="#16202b" font-weight="600" text-anchor="middle" letter-spacing="0">Create onboarding run</text>
<text x="393" y="130" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="middle" letter-spacing="0">owner  ·  target date  ·  client identity</text>
<polyline points="393 142 393 156" fill="none" stroke="#c6cedb" stroke-width="1.6"/>
<polyline points="137 156 559 156" fill="none" stroke="#c6cedb" stroke-width="1.6"/>
<polyline points="137 156 137 166" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="348 156 348 166" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="559 156 559 166" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="168" width="195" height="156" rx="8" fill="#eef4fa" stroke="#b9d0ea"/>
<text x="54" y="190" font-size="13.5" fill="#143c6e" font-weight="700" text-anchor="start" letter-spacing="0">Access</text>
<text x="54" y="206" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">a person grants</text>
<circle cx="58" cy="224" r="2.4" fill="#143c6e"/>
<text x="68" y="228" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Shopify store access</text>
<circle cx="58" cy="242" r="2.4" fill="#143c6e"/>
<text x="68" y="246" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Analytics access</text>
<text x="54" y="286" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">Relay tracks the invite and</text>
<text x="54" y="299" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">chases it; it never holds the</text>
<text x="54" y="312" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">credentials.</text>
<rect x="251" y="168" width="195" height="156" rx="8" fill="#eef4fa" stroke="#b9d0ea"/>
<text x="265" y="190" font-size="13.5" fill="#143c6e" font-weight="700" text-anchor="start" letter-spacing="0">Workspace</text>
<text x="265" y="206" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">Relay creates</text>
<circle cx="269" cy="224" r="2.4" fill="#143c6e"/>
<text x="279" y="228" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Folder structure</text>
<circle cx="269" cy="242" r="2.4" fill="#143c6e"/>
<text x="279" y="246" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Project board</text>
<circle cx="269" cy="260" r="2.4" fill="#143c6e"/>
<text x="279" y="264" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Kickoff document</text>
<text x="265" y="286" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">Templated and repeatable, so</text>
<text x="265" y="299" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">an automation is safe to</text>
<text x="265" y="312" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">retry.</text>
<rect x="462" y="168" width="195" height="156" rx="8" fill="#eef4fa" stroke="#b9d0ea"/>
<text x="476" y="190" font-size="13.5" fill="#143c6e" font-weight="700" text-anchor="start" letter-spacing="0">Commercial</text>
<text x="476" y="206" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">a person decides</text>
<circle cx="480" cy="224" r="2.4" fill="#143c6e"/>
<text x="490" y="228" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Billing setup</text>
<circle cx="480" cy="242" r="2.4" fill="#143c6e"/>
<text x="490" y="246" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Contract filing</text>
<text x="476" y="286" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">Money and legal stay with a</text>
<text x="476" y="299" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">human; Relay only tracks the</text>
<text x="476" y="312" font-size="10.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">evidence.</text>
<text x="348" y="344" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="middle" letter-spacing="0">Independent steps run in parallel — nothing waits on a step it does not depend on.</text>
<polyline points="137 326 137 356" fill="none" stroke="#c6cedb" stroke-width="1.6"/>
<polyline points="348 326 348 356" fill="none" stroke="#c6cedb" stroke-width="1.6"/>
<polyline points="559 326 559 356" fill="none" stroke="#c6cedb" stroke-width="1.6"/>
<polyline points="137 356 559 356" fill="none" stroke="#c6cedb" stroke-width="1.6"/>
<polyline points="348 356 348 372" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="374" width="617" height="44" rx="8" fill="#f8fafb" stroke="#c6cedb" stroke-dasharray="4 3"/>
<text x="56" y="392" font-size="10" fill="#5a6675" font-weight="700" text-anchor="start" letter-spacing="0.08em">RELAY RECORDS, PER STEP</text>
<text x="56" y="409" font-size="12" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">status  ·  owner  ·  due date  ·  attempts  ·  evidence link  ·  failure reason  ·  waiver reason</text>
<polyline points="348 420 348 438" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="440" width="617" height="46" rx="8" fill="#ffffff" stroke="#c6cedb"/>
<text x="348" y="460" font-size="13" fill="#16202b" font-weight="600" text-anchor="middle" letter-spacing="0">Dependency gate</text>
<text x="348" y="476" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="middle" letter-spacing="0">the kickoff call and welcome email wait until access, contract and billing are done</text>
<polyline points="348 488 348 504" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="506" width="617" height="42" rx="8" fill="#ffffff" stroke="#c6cedb"/>
<text x="348" y="532" font-size="13" fill="#16202b" font-weight="600" text-anchor="middle" letter-spacing="0">Book kickoff call   ·   Send welcome email</text>
<polyline points="348 550 348 566" fill="none" stroke="#c6cedb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="568" width="617" height="50" rx="8" fill="#1f5c43" stroke="#1f5c43"/>
<text x="348" y="590" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0">Run complete</text>
<text x="348" y="607" font-size="11.5" fill="#cfe4d8" font-weight="400" text-anchor="middle" letter-spacing="0">every required step done, or waived with a written reason in the audit log</text>
<text x="700" y="160" font-size="10" fill="#8a5100" font-weight="700" text-anchor="start" letter-spacing="0.08em">IF A STEP FAILS OR STALLS</text>
<rect x="700" y="168" width="340" height="58" rx="8" fill="#fdf3e2" stroke="#e8cf9e"/>
<text x="714" y="188" font-size="12.5" fill="#8a5100" font-weight="700" text-anchor="start" letter-spacing="0">Retryable failure</text>
<text x="714" y="204" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Relay retries automatically. An idempotency key means a</text>
<text x="714" y="217" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">second attempt cannot create a second folder or board.</text>
<rect x="700" y="242" width="340" height="58" rx="8" fill="#fdf3e2" stroke="#e8cf9e"/>
<text x="714" y="262" font-size="12.5" fill="#8a5100" font-weight="700" text-anchor="start" letter-spacing="0">Needs a person</text>
<text x="714" y="278" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Assign the owner, start an SLA clock. Dependent steps pause;</text>
<text x="714" y="291" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">independent ones keep running.</text>
<rect x="700" y="316" width="340" height="58" rx="8" fill="#fdf3e2" stroke="#e8cf9e"/>
<text x="714" y="336" font-size="12.5" fill="#8a5100" font-weight="700" text-anchor="start" letter-spacing="0">SLA breached</text>
<text x="714" y="352" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Escalate to Nadia. This is the two-weeks-without-store-access</text>
<text x="714" y="365" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">case, caught on day two instead of day fourteen.</text>
<rect x="700" y="390" width="340" height="68" rx="8" fill="#fdf3e2" stroke="#e8cf9e"/>
<text x="714" y="410" font-size="12.5" fill="#8a5100" font-weight="700" text-anchor="start" letter-spacing="0">Fixed, or waived with a reason</text>
<text x="714" y="426" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Resume from the blocked step. Work already completed is kept —</text>
<text x="714" y="439" font-size="10.8" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">nothing is rolled back, and nothing is silently skipped.</text>
<polyline points="870 226 870 240" fill="none" stroke="#e8cf9e" stroke-width="1.6" marker-end="url(#ara)"/>
<polyline points="870 300 870 314" fill="none" stroke="#e8cf9e" stroke-width="1.6" marker-end="url(#ara)"/>
<polyline points="870 374 870 388" fill="none" stroke="#e8cf9e" stroke-width="1.6" marker-end="url(#ara)"/>
<polyline points="659 197 694 197" fill="none" stroke="#e8cf9e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ara)"/>
<text x="676" y="189" font-size="9.5" fill="#5a6675" font-weight="400" text-anchor="middle" letter-spacing="0">any step</text>
<polyline points="700 424 678 424 678 290 661 290" fill="none" stroke="#e8cf9e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ara)"/>
<text x="688" y="283" font-size="9.5" fill="#8a5100" font-weight="400" text-anchor="middle" letter-spacing="0">resume</text>
<rect x="700" y="476" width="340" height="142" rx="8" fill="#f8fafb" stroke="#c6cedb"/>
<text x="714" y="498" font-size="10" fill="#5a6675" font-weight="700" text-anchor="start" letter-spacing="0.08em">THE RULE THAT MAKES THIS SAFE</text>
<text x="714" y="519" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">Relay never marks a required step done on its own.</text>
<text x="714" y="534" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">It either completes a step it is trusted to complete,</text>
<text x="714" y="549" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">or it holds the run open against a named person</text>
<text x="714" y="564" font-size="11.5" fill="#16202b" font-weight="400" text-anchor="start" letter-spacing="0">with a clock running.</text>
<text x="714" y="579" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0"></text>
<text x="714" y="594" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">A step can only leave the run in two ways: it is done,</text>
<text x="714" y="609" font-size="11.5" fill="#5a6675" font-weight="400" text-anchor="start" letter-spacing="0">or somebody waived it and said why.</text>
</svg>